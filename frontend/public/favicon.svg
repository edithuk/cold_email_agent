<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Brand gradient: violet → indigo → sky blue → mint teal -->
    <linearGradient id="flowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7B3FE4"/>
      <stop offset="30%"  stop-color="#5B5FF0"/>
      <stop offset="65%"  stop-color="#3B9CF5"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </linearGradient>

    <!-- Glow filter for the neon effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Stronger glow for nodes -->
    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Individual node gradient stops for per-node coloring -->
    <linearGradient id="n1color" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#8B4FFF"/>
      <stop offset="100%" stop-color="#6B3FD4"/>
    </linearGradient>
    <linearGradient id="n2color" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6060FF"/>
      <stop offset="100%" stop-color="#4B4FE0"/>
    </linearGradient>
    <linearGradient id="n3color" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3BA8FF"/>
      <stop offset="100%" stop-color="#2B90E8"/>
    </linearGradient>
    <linearGradient id="n4color" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00E4B8"/>
      <stop offset="100%" stop-color="#00C4A0"/>
    </linearGradient>
  </defs>

  <!-- ── Dark navy background ── -->
  <rect width="512" height="512" rx="115" fill="#080C18"/>

  <!-- ── S-CURVE PIPELINE SPINE ──
       Smooth bezier flowing from bottom-left to top-right
       Node positions:
         N1: (138, 358) — large, violet
         N2: (220, 268) — medium, indigo
         N3: (310, 190) — small-medium, sky blue
         N4: (390, 128) — small, mint teal
  -->
  <path
    d="M 138,358 C 160,310 196,310 220,268 C 244,226 284,224 310,190 C 336,156 368,148 390,128"
    stroke="url(#flowGrad)"
    stroke-width="11"
    stroke-linecap="round"
    fill="none"
    filter="url(#glow)"
    opacity="0.95"
  />

  <!-- ── NODE 1 — Bottom left, largest (Stage 1 / initial outreach) ── -->
  <circle cx="138" cy="358" r="36" stroke="url(#n1color)" stroke-width="10" fill="none" filter="url(#nodeGlow)"/>
  <!-- Inner dot -->
  <circle cx="138" cy="358" r="8" fill="#7B3FE4" opacity="0.6"/>

  <!-- ── NODE 2 — Medium-large (Stage 2 / first follow-up) ── -->
  <circle cx="220" cy="268" r="28" stroke="url(#n2color)" stroke-width="9" fill="none" filter="url(#nodeGlow)"/>
  <circle cx="220" cy="268" r="6" fill="#5B5FF0" opacity="0.6"/>

  <!-- ── NODE 3 — Medium (Stage 3 / second follow-up) ── -->
  <circle cx="310" cy="190" r="22" stroke="url(#n3color)" stroke-width="8" fill="none" filter="url(#nodeGlow)"/>
  <circle cx="310" cy="190" r="5" fill="#3B9CF5" opacity="0.6"/>

  <!-- ── NODE 4 — Top right, smallest (Stage 4 / final follow-up) ── -->
  <circle cx="390" cy="128" r="17" stroke="url(#n4color)" stroke-width="7" fill="none" filter="url(#nodeGlow)"/>
  <circle cx="390" cy="128" r="4" fill="#00D4AA" opacity="0.6"/>
</svg>